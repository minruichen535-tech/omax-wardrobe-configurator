<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="奥美斯定制收纳空间顾问" />
    <title>空间顾问 | OMAX</title>
    <link rel="stylesheet" href="/src/ai-planner/ai-planner.css?v=ai-planner-20260615-01" />
  </head>
  <body>
    <main class="planner-shell">
      <header class="planner-header">
        <a class="planner-brand" href="/" aria-label="返回奥美斯首页">
          <span>OM</span>
          <strong>OMAX</strong>
        </a>
        <div class="planner-progress" aria-live="polite">
          <span class="progress-current">1</span>
          <i></i>
          <span>5</span>
        </div>
      </header>

      <section class="planner-stage" aria-live="polite">
        <div class="paper-shadow" aria-hidden="true"></div>
        <article class="question-paper">
          <span class="question-mark">Q</span>
          <p class="question-eyebrow">A CONVERSATION ABOUT YOUR SPACE</p>
          <h1 class="question-title"></h1>
          <p class="question-note"></p>
        </article>

        <article class="answer-paper">
          <div class="answer-content"></div>
          <span class="answer-mark" aria-hidden="true">A</span>
        </article>
      </section>

      <footer class="planner-footer">
        <button class="back-button" type="button" disabled>← 返回上一题</button>
        <p>OMAX PERSONAL SPACE CONSULTANT</p>
      </footer>
    </main>
    <script type="module" src="/src/ai-planner/ai-planner.js?v=ai-planner-20260615-01"></script>
  </body>
</html>
